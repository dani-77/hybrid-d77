name: Build hybrid-d77 packages

# Builds h77-dots/h77-sway-dots/h77-installer via container/cbuild.Containerfile
# (real cports/cbuild, not guessed) and publishes them as a GitHub Release:
# build once in CI, pin/fetch the release asset locally instead of
# rebuilding from source every time. iso/fetch-pkgs.sh is the consumer side.
#
# The build itself needs --privileged (bwrap's own nested mount() calls
# fail without it under a container's default capability/seccomp set --
# confirmed the hard way locally, see docs/NOTES.md) -- GitHub-hosted
# runners are full VMs, so a --privileged container is allowed here the
# same as it is locally.
#
# --privileged on the container alone is NOT enough here, though,
# confirmed the hard way in CI (same "Can't mount proc on
# /newroot/proc"-class bwrap failure as the original local one, just
# from a different cause): ubuntu-latest runners are Ubuntu 24.04,
# which restricts unprivileged user namespace creation via an
# AppArmor policy at the HOST kernel level (`kernel.
# apparmor_restrict_unprivileged_userns`) -- a property of the runner
# VM itself, not something a container's own --privileged flag can
# override from the inside. Fixed by disabling that sysctl on the
# runner (not in the container) before building.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "pkg/**"
      - "container/cbuild.Containerfile"
      - "container/cbuild-entrypoint.sh"
      - ".github/workflows/build-h77-pkgs.yml"

permissions:
  contents: write

concurrency:
  group: build-h77-pkgs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Allow unprivileged user namespaces (bwrap needs this)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the cbuild container image
        run: docker build -t hybrid-d77-cbuild -f container/cbuild.Containerfile .

      - name: Build h77-dots / h77-sway-dots / h77-installer
        run: |
          # The container's "builder" user is a fixed uid 1000
          # (container/cbuild.Containerfile), chosen to match a local
          # dev host's own uid by convention -- the GH Actions runner
          # user is a different uid, so the checkout it owns isn't
          # writable by uid 1000 inside the container. Confirmed the
          # hard way: "mkdir: /src/cbuild-out: Permission denied".
          # Pre-create cbuild-out with the right ownership so the
          # container only needs to write into it, not create it.
          mkdir -p cbuild-out
          sudo chown -R 1000:1000 cbuild-out
          docker run --rm --privileged --security-opt label=disable \
            -v "$PWD:/src" -w /src hybrid-d77-cbuild
          # Hand it back: the container wrote its output as uid 1000,
          # but the *next* step (Checksum) runs as the runner's own
          # user -- confirmed the hard way, "SHA256SUMS: Permission
          # denied" writing into a dir still owned by 1000.
          sudo chown -R "$(id -u):$(id -g)" cbuild-out

      - name: Checksum
        run: |
          # Release assets are uploaded flat (gh release upload/download
          # don't preserve any directory structure -- confirmed the hard
          # way, iso/fetch-pkgs.sh's `sha256sum -c` failed looking for
          # "hybrid/x86_64/h77-dots-....apk" inside its own flat tmp
          # download dir). SHA256SUMS must record plain basenames to
          # match, so cd into each real source dir instead of globbing
          # with the directory prefix baked into the recorded path.
          cd cbuild-out
          (cd hybrid/x86_64 && sha256sum *.apk APKINDEX.tar.gz) > SHA256SUMS
          sha256sum *.pub >> SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="h77-pkgs"
          # Retried, not guessed: two runs in a row (2026-09-13) failed
          # here on nothing but a transient GitHub API error -- HTTP 500
          # then HTTP 502 -- with the actual build already done and
          # fine both times. gh itself has no built-in retry for this,
          # so wrap the whole view/delete/create sequence in one.
          # Real bug in an earlier version of this retry, caught by the
          # very next CI run: GitHub Actions runs `run:` steps under
          # `bash -e` by default, and `gh release view ... && gh
          # release delete ...` below was a plain statement, NOT an if/
          # while/until condition -- the one context `-e` exempts from
          # triggering an exit on failure. A transient error on the
          # delete call killed the whole step instantly, before the
          # retry loop's own logic ever ran. Fixed by putting view in
          # its own `if` and `|| true`-ing delete, so no individual
          # command in the loop body can trigger an early exit -- only
          # the loop finishing (success or all 5 attempts) decides that.
          n=0
          until [ "$n" -ge 5 ]; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
            if gh release create "$tag" \
              --title "hybrid-d77 packages (h77-dots, h77-sway-dots, h77-installer)" \
              --notes "Built by ${{ github.workflow }} from ${{ github.sha }}. Consumed by iso/fetch-pkgs.sh, not meant to be installed by hand." \
              cbuild-out/*.pub \
              cbuild-out/hybrid/x86_64/*.apk \
              cbuild-out/hybrid/x86_64/APKINDEX.tar.gz \
              cbuild-out/SHA256SUMS
            then
              exit 0
            fi
            n=$((n + 1))
            echo "publish attempt $n failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "publish failed after $n attempts" >&2
          exit 1
