
# hybrid-d77: gtk-theme-name switched from Arc-Dark to Breeze-Dark --
# arc-theme doesn't exist in cports, breeze-gtk (`main`) does, and
# ships KDE's Breeze GTK theme under its own standard KDE naming
# (Breeze/Breeze-Dark, user-confirmed). gtk-icon-theme-name is
# Papirus-Dark -- confirmed the real name papirus-icon-theme's own
# Makefile installs (EXTRA_THEMES="Papirus-Dark Papirus-Light" by
# default, alongside the base Papirus theme). gtk-cursor-theme-name
# (Void's own "whiteglass") dropped entirely -- confirmed genuinely
# absent from cports (no cursor-theme package at all, main or user),
# so it could never resolve to anything; GTK's own built-in default
# applies instead now, cleanly, rather than silently failing to find a
# theme that was never going to exist.
[Settings]
gtk-theme-name = Breeze-Dark
gtk-icon-theme-name = Papirus-Dark
# GTK3 ignores bold or italic attributes.
gtk-font-name = Hack 10
gtk-menu-images = 1
gtk-button-images = 1
gtk-toolbar-style = GTK_TOOLBAR_BOTH_HORIZ
