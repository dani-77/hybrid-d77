# hybrid-d77 :: foot terminal
font=Hack:size=11
dpi-aware=yes
initial-color-theme=dark

# foot >= 1.28 renamed [colors] -> [colors-dark] / [colors-light]
# (confirmed already present in foot 1.27.0, the version cports ships,
# and it's the same convention d77alpine's own foot.ini uses).
[colors-dark]
background=1e1e2e
foreground=cdd6f4
alpha=0.9

[cursor]
style=beam
