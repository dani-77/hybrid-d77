
# lxqt-config-appearance only writes GTK3's settings.ini; GTK4 apps have no
# portal/XSETTINGS source for the theme on non-GNOME Wayland sessions (e.g.
# mango) and silently fall back to Adwaita otherwise. Keep this in sync with
# ../gtk-3.0/settings.ini.
#
# hybrid-d77: gtk-cursor-theme-name (Void's own "whiteglass") dropped
# -- confirmed genuinely absent from cports, see gtk-3.0/settings.ini's
# own comment for the full reasoning.
[Settings]
gtk-theme-name = Breeze-Dark
gtk-icon-theme-name = Papirus-Dark
gtk-font-name = Hack 10
gtk-application-prefer-dark-theme = 1
