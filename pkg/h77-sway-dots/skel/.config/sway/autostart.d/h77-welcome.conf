# hybrid-d77 :: h77-welcome autostart trigger.
#
# Kept as its own drop-in file, included from sway/config via `include
# ~/.config/sway/autostart.d/*.conf`, rather than a literal exec line
# in that packaged config -- h77-welcome's own "Don't show this again"
# menu item deletes THIS FILE ENTIRELY, so opting out needs no
# permanent flag-file check baked into sway/config, mirroring d77void's
# own d77-welcome (which deletes ~/.auto.sh the same way). Once this
# file is gone, the glob above matches nothing, which sway treats as a
# silent no-op.
exec foot -a h77-welcome -e h77-welcome
