# hybrid-d77 :: yambar config for the h77 sway session.
#
# Same catppuccin-mocha palette as ../sway/catppuccin-mocha (kept in sync
# by hand -- yambar can't source sway's `set $var` colors, so these are
# the same hex values copied over). Real yambar YAML syntax, checked
# against dnkl/yambar's own example-config.yml/laptop.conf, not guessed
# -- see docs/NOTES.md for the exact modules/fields verified.
#
# NOT started via `bar { }` in sway/config (that's swaybar, a different
# thing) -- launched with a plain `exec yambar` instead. See sway/config
# for that line.

bar:
  height: 26
  location: top
  spacing: 8
  margin: 6

  font: monospace:pixelsize=13

  background: 1e1e2eff
  foreground: cdd6f4ff

  border:
    width: 0

  left:
    - i3:
        content:
          "":
            map:
              conditions:
                state == focused:
                  string: {text: " {name} ", foreground: 1e1e2eff, deco: {background: {color: cba6f7ff}}}
                state == unfocused:
                  string: {text: " {name} ", foreground: cdd6f4ff}
                state == invisible:
                  string: {text: " {name} ", foreground: 6c7086ff}
                state == urgent:
                  string: {text: " {name} ", foreground: 11111bff, deco: {background: {color: f38ba8ff}}}

  center:
    - clock:
        time-format: "%H:%M"
        date-format: "%a %d %b"
        content:
          - string: {text: "{date}", foreground: a6adc8ff, right-margin: 8}
          - string: {text: "{time}", foreground: cdd6f4ff}

  right:
    - cpu:
        poll-interval: 2000
        content:
          map:
            conditions:
              id < 0:
                map:
                  default:
                    string: {text: "cpu {cpu}%", foreground: cdd6f4ff}
                  conditions:
                    cpu >= 90:
                      string: {text: "cpu {cpu}%", foreground: f38ba8ff}

    - mem:
        poll-interval: 2000
        content:
          map:
            default:
              string: {text: "ram {percent_used}%", foreground: cdd6f4ff}
            conditions:
              percent_used >= 90:
                string: {text: "ram {percent_used}%", foreground: f38ba8ff}

    - alsa:
        card: default
        mixer: Master
        content:
          map:
            conditions:
              muted: {string: {text: "mute", foreground: 6c7086ff, on-click: "amixer -q sset Master toggle"}}
              ~muted: {string: {text: "vol {percent}%", foreground: cdd6f4ff, on-click: "amixer -q sset Master toggle"}}

    - battery:
        name: BAT0
        poll-interval: 30000
        content:
          map:
            default:
              string: {text: "bat {capacity}%", foreground: cdd6f4ff}
            conditions:
              state == charging:
                string: {text: "chg {capacity}%", foreground: a6e3a1ff}
              state == full:
                string: {text: "full", foreground: a6e3a1ff}
              capacity <= 15:
                string: {text: "bat {capacity}%", foreground: f38ba8ff}

    - label:
        content:
          string: {text: " power ", foreground: 11111bff, deco: {background: {color: f38ba8ff}}, on-click: "systemctl poweroff"}
