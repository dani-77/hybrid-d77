# hybrid-d77 :: default answers for chimera-installer (real format --
# config_load() in chimera-installer reads any INSTALL_CONFIG_* line
# straight from this file into the environment, confirmed against its
# own source, not guessed).
#
# Only defaults that are SAFE regardless of the target machine's disk
# layout are set here -- SystemRoot (disk/partition selection) is
# deliberately left out, it has to stay interactive.
#
# SOURCE=local: chimera-bootstrap -l copies the LIVE's own mounted
# rootfs (/run/live/rootfs/filesystem.*) into the target with a plain
# tar, no apk/network involved at all. Since h77-dots/h77-sway-dots
# (and everything else in this image's own package set: sway, yambar,
# fuzzel, the bootloader packages from base-live, the kernel, ...) are
# ALREADY part of that live rootfs, a local install gets all of it for
# free -- no need to also list them in INSTALL_CONFIG_PACKAGES, and
# doing so would be actively wrong: chimera-installer's own "extra
# packages" step always does a real `apk add` in the target
# afterward, REGARDLESS of local vs network source, so redundantly
# listing packages already present here would force a network
# round-trip that isn't needed and won't work fully offline. Verified
# against chimera-bootstrap's real source (the local-mode tar copy)
# and chimera-installer's own menu_install (the unconditional apk add
# "$@" step) -- not guessed. If SOURCE is switched to "network" in the
# menu, packages have to be filled in by hand at that point (nothing
# here does that automatically -- out of scope for this first pass).
INSTALL_CONFIG_SOURCE="local"

# Nothing exotic, and it means one less interactive prompt.
INSTALL_CONFIG_KERNEL="stable"

# Cosmetic only, freely editable in the menu before installing.
INSTALL_CONFIG_HOSTNAME="hybrid-d77"
