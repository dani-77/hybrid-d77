# hybrid-d77: niri's own /usr/share/xdg-desktop-portal/niri-portals.conf,
# plus a FileChooser override. xdg-desktop-portal reads only the first
# niri-portals.conf it finds, so this is a full copy, not a diff.
# xdg-desktop-portal-gnome (51) hands its file chooser to Nautilus, which
# the image doesn't ship, so file dialogs would never open; use the GTK
# backend for that interface instead (gnome stays default for screencast).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
